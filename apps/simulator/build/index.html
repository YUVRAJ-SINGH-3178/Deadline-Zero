  font-family: Inter, ui-sans-serif, system-ui, sans-serif;

  background: #071128;

}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background:
    radial-gradient(circle at 85% 0, #312b76 0, transparent 32rem), #071128;
}
#app {
  width: min(1120px, calc(100% - 32px));
  margin: auto;
  padding: 56px 0;
}
header {
  margin-bottom: 28px;
}
.eyebrow {
  letter-spacing: 0.12em;
  font-size: 0.72rem;
  color: #99f6e4;
  font-weight: 800;
}
h1 {
  font-size: clamp(2.6rem, 8vw, 5.6rem);
  line-height: 0.9;
  margin: 0.5rem 0;
}
h1 i {
  color: #9da8ff;
  font-style: normal;
}
h2 {
  font-size: 1.15rem;
  margin: 0 0 0.5rem;
}
p {
  color: #b8c5df;
  line-height: 1.55;
}
.card {
  background: #0f1d3dce;
  border: 1px solid #30446f;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 24px 80px #02061755;
}
.connect {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 24px;
  margin-bottom: 20px;
}
.fields {
  display: grid;
  gap: 12px;
}
label {
  font-size: 0.8rem;
  font-weight: 700;
  color: #cbd8f4;
}
input {
  display: block;
  width: 100%;
  margin-top: 6px;
  border: 1px solid #40577f;
  border-radius: 10px;
  background: #08142e;
  color: white;
  padding: 11px;
  font: inherit;
}
.status {
  margin: 0;
  font-size: 0.9rem;
}
.status.ready {
  color: #99f6e4;
}
.status.error {
  color: #ffb4a7;
}
.workspace {
  display: grid;
  grid-template-columns: minmax(260px, 0.72fr) minmax(0, 1.28fr);
  gap: 20px;
  margin-bottom: 20px;
}
.controls button {
  display: block;
  width: 100%;
  margin: 11px 0;
  text-align: left;
}
.controls button:last-child {
  margin-bottom: 0;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 13px 15px;
  background: #a5b4fc;
  color: #10142c;
  font: inherit;
  font-weight: 800;
  cursor: pointer;
  transition:
    transform 0.18s,
    opacity 0.18s;
}
button:hover:not(:disabled) {
  transform: translateY(-1px);
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.secondary {
  background: transparent;
  color: #d6e1ff;
  border: 1px solid #5973a5;
}
.plan-heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}
.plan-heading p {
  margin: 0.2rem 0;
}
.risk {
  height: max-content;
  border-radius: 99px;
  background: #94f7d4;
  color: #052319;
  padding: 6px 10px;
  font-size: 0.72rem;
  font-weight: 900;
}
.risk.high {
  background: #ffc0b3;
  color: #3a100a;
}
.risk.medium {
  background: #fde68a;
  color: #3f2e00;
}
ol {
  margin: 18px 0 0;
  padding: 0;
  list-style: none;
}
#schedule li {
  display: grid;
  grid-template-columns: 100px 1fr;
  gap: 12px;
  padding: 16px 0;
  border-top: 1px solid #2c4168;
}
#schedule time {
  font-weight: 800;
  color: #a5b4fc;
}
#schedule span {
  display: block;
  color: #99a9c9;
  font-size: 0.85rem;
  margin-top: 3px;
}
.empty {
  color: #99a9c9;
}
.trace {
  display: grid;
  grid-template-columns: 1fr 1.3fr;
  gap: 24px;
}
.trace ol {
  margin: 0;
  max-height: 260px;
  overflow: auto;
}
.trace li {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 9px 0;
  border-bottom: 1px solid #283c60;
  font-size: 0.84rem;
}
.trace li span {
  color: #afbdd7;
  text-align: right;
}
.trace li.failure strong {
  color: #ffb4a7;
}
code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  color: #c4b5fd;
}
footer {
  margin: 32px 0;
  color: #8292b5;
  font-size: 0.78rem;
  line-height: 1.5;
}
@media (max-width: 760px) {
  #app {
    padding: 30px 0;
  }
  .connect,
  .workspace,
  .trace {
    grid-template-columns: 1fr;
  }
  .plan-heading {
    align-items: flex-start;
    flex-direction: column;
  }
  #schedule li {
    grid-template-columns: 82px 1fr;
  }
}

/* Subtitle and walkthrough overlay */
.subtitle-bar {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: min(920px, calc(100% - 32px));
  background: rgba(8, 18, 42, 0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(147, 197, 253, 0.35);
  box-shadow: 0 16px 48px -8px rgba(0, 0, 0, 0.75), 0 0 24px rgba(56, 189, 248, 0.2);
  border-radius: 16px;
  overflow: hidden;
  z-index: 10000;
  color: #fff;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.subtitle-progress-track {
  height: 3px;
  width: 100%;
  background: rgba(255, 255, 255, 0.1);
}
.subtitle-progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #38bdf8, #818cf8);
  transition: width 0.3s linear;
}
.subtitle-content {
  padding: 12px 20px;
}
.subtitle-header {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.subtitle-time {
  font-family: ui-monospace, monospace;
  font-size: 0.76rem;
  color: #94a3b8;
  background: rgba(255, 255, 255, 0.08);
  padding: 2px 7px;
  border-radius: 4px;
}
.subtitle-tag {
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  background: rgba(56, 189, 248, 0.2);
  color: #38bdf8;
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid rgba(56, 189, 248, 0.3);
}
.subtitle-main {
  font-size: 1.02rem;
  font-weight: 700;
  color: #f1f5f9;
  letter-spacing: -0.01em;
}
.subtitle-narration {
  font-size: 0.92rem;
  color: #cbd5e1;
  font-style: italic;
  line-height: 1.4;
  margin-top: 2px;
}
.highlight-target {
  outline: 2px solid #38bdf8 !important;
  outline-offset: 4px !important;
  box-shadow: 0 0 28px rgba(56, 189, 248, 0.5) !important;
  transition: outline 0.3s ease, box-shadow 0.3s ease;
}
.walkthrough-bar {
  display: flex;
  gap: 12px;
  margin-top: 14px;
  align-items: center;
}
.walkthrough-btn {
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  color: #030712;
  font-weight: 800;
  padding: 10px 18px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.walkthrough-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
}
